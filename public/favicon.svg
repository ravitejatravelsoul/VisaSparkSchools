<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="vss-mark-title">
  <title id="vss-mark-title">VisaSparkSchools mark</title>
  <defs>
    <linearGradient id="vss-mark-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14532d" />
      <stop offset="1" stop-color="#0d3d21" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vss-mark-bg)" />
  <!-- V monogram, doubling as an open book viewed edge-on -->
  <path d="M16 15 L32 47" stroke="#fbfaf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <path d="M48 15 L32 47" stroke="#fbfaf8" stroke-width="8" stroke-linecap="round" fill="none" />
  <!-- code-cursor tick, top right -->
  <rect x="45.5" y="7" width="5" height="12" rx="2.5" fill="#fbfaf8" />
  <!-- spark accent, top left -->
  <path
    d="M13 6.5 L14.6 10.9 L19 12.5 L14.6 14.1 L13 18.5 L11.4 14.1 L7 12.5 L11.4 10.9 Z"
    fill="#fb923c"
  />
</svg>
